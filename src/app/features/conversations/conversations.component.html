<div class="conversations-page-wrapper">
    <div class="header">{{ receiver.userName }}</div>
    <div class="messages-container">
        @for (message of messages; track message.id) {
            <p class="messages-container__message" 
                [class.messages-container__message--mine]="message.isMine">
                <span>{{ message.content }}</span>
                <mat-icon class="messages-container__message-status">check</mat-icon>
            </p>
        }

        @for (unsentMessage of unsentMessages(); track unsentMessage.id) {
            <p class="messages-container__message messages-container__message--mine">
                <span>{{ unsentMessage.content }}</span>
                <mat-icon class="messages-container__message-status">schedule</mat-icon>
            </p>
        }
        <input 
            type="text" 
            class="messages-container__input" 
            [formControl]="newMessageFormControl" 
            (keyup.enter)="sendMessage()" 
            placeholder="Type a message..." 
        />
    </div>

    @if (errorMessage) {
        <div class="conversations-page-wrapper__error-message">
            {{ errorMessage }}
        </div>
    }
</div>
